# SPDX-License-Identifier: GPL-3.0-or-later
#
# MoltRepublic — workspace.
#
# Layering discipline carried over from konkinwallet (pw-*): one crate per
# concern, a lower crate never depends on a higher one, and the core holds the
# command/event contract with no I/O. The spine here is deliberately small and
# centred on one invariant: there is ONE command set (`molt-core::Command`),
# executed in ONE place (`molt-engine`), and every frontend — the MCP interface
# and the GUI — drives that same set as a co-equal operator.
#
#   molt-core    domain types, Command/Event/Surface contract, errors — no I/O
#   molt-config  config.toml schema, render, salvage, round-trip write (no I/O deps)
#   molt-storage encrypted append-only workspace storage: event log, snapshots, keys
#   molt-net     the transport: MLS-protected payloads over queue transports (loopback today, Nostr relays in build)
#   molt-engine  the wallet-core actor: single owning task, WalletHandle
#   molt-mcp     MCP frontend (the headless operator; stdio or tcp)
#   molt-ui-window  the Slint-compiled window (own crate: the ~400k-line
#                   generated module recompiles only on .slint changes)
#   molt-ui      Slint GUI frontend logic (the live-mirror operator)
#   molt-app     the binary: ui-mode (GUI + MCP) | headless (MCP-only)
#
# Future surface crates (molt-board / molt-memory / molt-treasury / molt-vault /
# molt-policy, per moltrepublic_backend_plan R2–R6) plug into molt-engine behind
# the same Surface/Approvable contract; they are not scaffolded yet.

[workspace]
resolver = "2"
members = [
    "crates/molt-core",
    "crates/molt-config",
    "crates/molt-storage",
    "crates/molt-net",
    "crates/molt-engine",
    "crates/molt-mcp",
    "crates/molt-ui-window",
    "crates/molt-ui",
    "crates/molt-app",
]
# The GUI is standard: `cargo build` builds the whole workspace, Slint included.
# Headless is a runtime choice (`[node].headless` in config.toml, or automatic
# when no display is available), not a separate build.

[workspace.dependencies]
# internal
molt-core    = { path = "crates/molt-core" }
molt-config  = { path = "crates/molt-config" }
molt-storage = { path = "crates/molt-storage" }
molt-net     = { path = "crates/molt-net" }
molt-engine  = { path = "crates/molt-engine" }
molt-mcp     = { path = "crates/molt-mcp" }
molt-ui-window = { path = "crates/molt-ui-window" }
molt-ui      = { path = "crates/molt-ui" }

# external
tokio              = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-std", "io-util", "net", "time"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
toml               = "0.8"
toml_edit          = "0.22"   # format-preserving config.toml rewrites (comments survive a save)
tempfile           = "3"      # dev-dependency of the config/store tests
clap               = { version = "4", features = ["derive"] }
anyhow             = "1"
thiserror          = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize            = { version = "1", features = ["derive"] }
arboard            = { version = "3", default-features = false }
chrono             = { version = "0.4", default-features = false, features = ["clock"] }
strum              = { version = "0.27", features = ["derive"] }
paste              = "1"
url                = "2.5"    # the WHATWG parser every real client dials with — the relay
                              # host policy MUST read the same parse (mdk_evaluation.md §6/§7.1);
                              # pure Rust, no I/O, already in the graph via `nostr`

# storage (molt-storage): encrypted append-only event log + snapshots
chacha20poly1305   = "0.10"   # XChaCha20-Poly1305 AEAD for frames/snapshots/sealed keys
hkdf               = "0.12"   # seed -> workspace id/key derivations
sha2               = "0.10"
hmac               = "0.12"   # invite ticket -> JoinRequest MAC binding (molt-net)
tokio-socks        = "0.5"    # SOCKS5h client (Tor dialing, per-host isolation creds) —
                              # replaced the hand-rolled socks5.rs (mdk_evaluation.md §7.7)
# N2 own WS client (ADR-0005): tungstenite WITHOUT its TLS features — TLS is our
# rustls-rustcrypto config over the T4 DialStream, so ring stays out of the graph
tokio-tungstenite  = { version = "0.26", default-features = false, features = ["handshake"] }
futures-util       = { version = "0.3", default-features = false, features = ["sink"] }
httparse           = "1"      # NIP-11 response-head parsing (already in the tree via tungstenite)
ed25519-dalek      = { version = "2", default-features = false, features = ["std", "rand_core"] }  # member identity keys (derived, never random)
crc32c             = "0.6"    # molt-storage: torn-write/bitrot detection over the ciphertext

# TLS + dialing (molt-net). Pure-Rust: rustls with the RustCrypto provider
# keeps the no-C-toolchain / reproducible posture (rustls-rustcrypto instead
# of ring/aws-lc). The stack serves S3-over-https (WebPKI verify) and the T4
# fail-closed Tor dialer; N2's WebSocket relay connections reuse both.
rustls             = { version = "0.23", default-features = false, features = ["std", "tls12"] }
tokio-rustls       = { version = "0.26", default-features = false, features = ["tls12"] }
rustls-rustcrypto  = "0.0.2-alpha"
webpki-roots       = "1"      # Mozilla CA roots as pure-Rust data (S3-over-https verify)
base64             = "0.22"   # binary-in-text blobs (proposal images, backup/export payloads)
argon2             = "0.5"    # passphrase KDF of the export blob (RustCrypto, pure Rust)
unicode-normalization = "0.1" # NFC of export passphrases before the KDF
getrandom          = "0.2"    # OS CSPRNG: seeds, nonces, device key
hex                = "0.4"
bip39              = "2"      # real recovery-phrase wordlist (replaces mock_seed)
rustix             = { version = "1", features = ["fs"] }   # flock for the per-workspace LOCK

# Nostr transport (N0+, docs_archive/transport/nostr_transport_marmot.md). rust-nostr
# with its C libsecp256k1 backend — the sanctioned transport-edge C exception
# (ADR-0002); nip44/nip59 are the NIP-EE envelope crypto. `nostr` is a REAL
# molt-net dependency since N1 (the ticket-salted identity anchor), so
# secp256k1-sys is in the default build graph. The relay pool and the
# in-process test relay stay DEV-ONLY until N2 decides the runtime WS/TLS
# stack: nostr-relay-pool → async-wsocket hard-pins tokio-rustls with the
# `ring` provider (audited 2026-07-30), which the default build must not
# silently re-adopt after N-demo drops the SMP cert-pin.
nostr               = { version = "0.44.6", default-features = false, features = ["std", "nip44", "nip59"] }
nostr-relay-pool    = "0.44.1"
nostr-relay-builder = "0.44.1"
chacha20            = "0.9"    # nip44 vector pin recomputes reference ciphertexts (dev-only)

# MLS group encryption (molt-net, T2). Pure-Rust provider (RustCrypto +
# hpke-rs/libcrux + ed25519-dalek/x25519-dalek + chacha20poly1305/aes-gcm) —
# keeps the no-C-toolchain posture. The mandatory ciphersuite
# MLS_128_DHKEMX25519_AES128GCM_SHA256_Ed25519 matches our Ed25519 identity
# keys + X25519 exactly. Companion crates version independently of openmls.
openmls                  = "0.8.1"
openmls_traits           = "0.5.0"
openmls_rust_crypto      = "0.5.1"
openmls_basic_credential = "0.5.0"
tls_codec                = "0.4.2"   # MLS wire (de)serialization
bincode                  = "1"       # snapshot the provider's byte-keyed storage map (JSON can't)

# GUI (molt-ui). FemtoVG (pure-Rust GPU renderer) is the default — it can
# rasterize color-emoji fonts (Twemoji nav icons / reactions) and fixes the
# software renderer's resize flicker; the software renderer stays in as the
# no-GL fallback. Both keep the build pure-Rust (no Skia/C++ toolchain);
# backend-winit gives a real window.
slint       = { version = "1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "renderer-software", "compat-1-2"] }
slint-build = "1"
# native file picker (chat file sharing). XDG portal backend: pure Rust
# (zbus), no GTK build dependency; talks to the desktop's portal service.
# MUST stay on the async-std/async-io flavor, NOT "tokio": Slint's winit
# backend uses zbus too (color-scheme portal, on the GUI main thread), and
# cargo feature-unification would flip Slint's zbus into tokio mode — which
# panics ("no reactor running") on any thread without a tokio context.
rfd         = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
# decode a proposal payload's image bytes IN MEMORY (content-sniffed via
# guess_format — a payload carries no file name, so an extension-keyed path
# load can never work). Exactly the raster formats the logo picker offers;
# all pure-Rust decoders. Same crate+version Slint already compiles in.
image       = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
# the wiki pane's markdown pseudo-render (molt-ui): same crate+version the
# Slint text stack already compiles in; parser only, no html feature
pulldown-cmark = { version = "0.13", default-features = false }
# block-level diffs for the wiki's pending-change preview (molt-ui) — the
# insta/cargo-insta diff engine, not a hand-rolled LCS
similar     = "2"

[workspace.package]
version    = "0.0.1"
edition    = "2021"
license    = "GPL-3.0-or-later"
authors    = ["Peter Geschel <geschel@gmail.com>"]
repository = "https://github.com/TBD/moltrepublic"   # grep-replace once the public repo URL is locked
rust-version = "1.80"

[workspace.lints.clippy]
unwrap_used      = "warn"
todo             = "warn"
dbg_macro        = "warn"
as_conversions   = "warn"
float_arithmetic = "warn"

[workspace.lints.rust]
missing_docs    = "warn"
unsafe_code     = "deny"     # deny (not forbid): Slint-generated code wraps internal unsafe in #[allow]
unused_must_use = "deny"

[profile.dev]
overflow-checks = true
# NOTE: unlike konkinwallet we keep dev unwinding (no panic="abort") so the unit
# test harness builds on stable. The release posture below mirrors konkin.

# The Slint-generated window is a ~400k-line machine-written module, and the
# incremental cache costs GiBs of peak RSS on its single rustc: with it on,
# that one process was OOM-killed three runs in a row at 11.6/13.1/13.7 GiB
# anon-RSS (kernel log, 2026-08-21/22, 15 GiB box, rustc 1.95.0 + Slint 1.17,
# no concurrency); with it off the build completes. Off for THIS crate only, so
# the rest of the workspace keeps its fast incremental rebuilds. Removing this
# makes `cargo build -p molt-ui-window` die by SIGKILL again.
[profile.dev.package.molt-ui-window]
incremental = false

[profile.release]
overflow-checks = true       # mirror monero-oxide security posture
panic           = "abort"    # no stack unwinding that could surface secrets
lto             = "thin"
codegen-units   = 1          # determinism input for reproducible release builds
strip           = "none"     # strip in a build-release post-step, keep debug-info locally
