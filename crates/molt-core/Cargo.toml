[package]
name = "molt-core"
description = "Domain types, the Command/Event/Surface contract, errors — no I/O."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
strum.workspace = true
hex.workspace = true # pure byte↔string encoding (MessageId wire form) — still no I/O
url.workspace = true # WHATWG relay-URL parsing (relay.rs) — pure Rust, still no I/O
similar.workspace = true # the wiki patch EMITTER, beside its applier (wiki_patch.rs) — pure Rust, no I/O
pulldown-cmark.workspace = true # the `upload:` reference grammar (wiki_refs.rs) — pure parser, no I/O
zeroize.workspace = true # wipes the vault seed on drop - pure Rust, no I/O
# the vault's content ids (`vault::secret_id`, `vault::grant_id`) hash beside
# their layouts; still RNG-free, no curve arithmetic (that is molt-vault)
sha2.workspace = true
