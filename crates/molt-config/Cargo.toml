[package]
name = "molt-config"
description = "On-disk node configuration (config.toml): strict schema, render, lenient salvage, round-trip write. One source of truth shared by moltd and the GUI settings panel."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
# the ONE literal for the old default cap (`LEGACY_FILE_CAP_BYTES`)
molt-core.workspace = true
serde.workspace = true
# the OS CSPRNG for the MCP token — never a /dev/urandom path open, whose
# failure mode is an EMPTY token that silently disables authentication
getrandom.workspace = true
toml.workspace = true
toml_edit.workspace = true

[dev-dependencies]
tempfile.workspace = true
