# What compiles for wasm32 and dies in a browser at run time, or has no
# browser form at all (docs/web_gui.md, section 8.3). Shared window code
# reaches these through the platform seam; `native.rs` is the one module
# that may name them. Kept identical in molt-ui and molt-ui-kit.
disallowed-methods = [
    # clocks
    { path = "std::time::Instant::now", reason = "platform().monotonic()" },
    { path = "std::time::SystemTime::now", reason = "platform().unix_now()" },
    { path = "chrono::Utc::now", reason = "crate::platform::utc_now()", allow-invalid = true },
    { path = "chrono::Local::now", reason = "crate::platform::utc_now()", allow-invalid = true },
    # threads and child processes
    { path = "std::thread::spawn", reason = "Ctx::spawn or native::off_thread" },
    { path = "std::thread::sleep", reason = "platform().sleep()" },
    { path = "std::process::Command::new", reason = "no child process in a browser" },
    # the process environment
    { path = "std::env::current_dir", reason = "native only" },
    { path = "std::env::var", reason = "native only" },
    { path = "std::env::var_os", reason = "native only" },
    { path = "std::env::temp_dir", reason = "native only" },
    # the disk
    { path = "std::fs::read", reason = "platform().read_file(); a picture: crate::bytes" },
    { path = "std::fs::read_to_string", reason = "platform().read_file()" },
    { path = "std::fs::write", reason = "platform().save_file()" },
    { path = "std::fs::metadata", reason = "native only" },
    { path = "std::fs::symlink_metadata", reason = "native only" },
    { path = "std::fs::read_dir", reason = "native only" },
    { path = "std::fs::create_dir", reason = "native only" },
    { path = "std::fs::create_dir_all", reason = "native only" },
    { path = "std::fs::remove_file", reason = "native only" },
    { path = "std::fs::remove_dir", reason = "native only" },
    { path = "std::fs::remove_dir_all", reason = "native only" },
    { path = "std::fs::rename", reason = "native only" },
    { path = "std::fs::copy", reason = "native only" },
    { path = "std::fs::canonicalize", reason = "native only" },
    { path = "std::fs::read_link", reason = "native only" },
    { path = "std::fs::hard_link", reason = "native only" },
    { path = "std::fs::set_permissions", reason = "native only" },
    { path = "std::fs::File::open", reason = "platform().read_file()" },
    { path = "std::fs::File::create", reason = "platform().save_file()" },
    { path = "std::fs::OpenOptions::new", reason = "platform().save_file()" },
    { path = "std::path::Path::exists", reason = "native only" },
    { path = "std::path::Path::try_exists", reason = "native only" },
    { path = "std::path::Path::is_dir", reason = "native only" },
    { path = "std::path::Path::is_file", reason = "native only" },
    { path = "std::path::Path::metadata", reason = "native only" },
    { path = "std::path::Path::symlink_metadata", reason = "native only" },
    { path = "std::path::Path::canonicalize", reason = "native only" },
    { path = "std::path::Path::read_dir", reason = "native only" },
    { path = "std::path::Path::is_symlink", reason = "native only" },
    { path = "std::path::Path::read_link", reason = "native only" },
    # the runtime
    { path = "tokio::spawn", reason = "Ctx::spawn", allow-invalid = true },
    { path = "tokio::task::spawn", reason = "Ctx::spawn", allow-invalid = true },
    { path = "tokio::task::spawn_local", reason = "Ctx::spawn", allow-invalid = true },
    { path = "tokio::task::spawn_blocking", reason = "native::off_thread", allow-invalid = true },
    { path = "tokio::task::block_in_place", reason = "native::off_thread", allow-invalid = true },
    { path = "tokio::runtime::Handle::current", reason = "Ctx::spawn", allow-invalid = true },
    { path = "tokio::runtime::Handle::try_current", reason = "Ctx::spawn", allow-invalid = true },
    { path = "tokio::runtime::Handle::spawn", reason = "Ctx::spawn", allow-invalid = true },
    { path = "tokio::runtime::Handle::spawn_blocking", reason = "native::off_thread", allow-invalid = true },
    { path = "tokio::runtime::Handle::block_on", reason = "Ctx::spawn", allow-invalid = true },
    { path = "tokio::runtime::Runtime::new", reason = "the binary owns the runtime", allow-invalid = true },
    { path = "tokio::runtime::Builder::new_multi_thread", reason = "the binary owns the runtime", allow-invalid = true },
    { path = "tokio::runtime::Builder::new_current_thread", reason = "the binary owns the runtime", allow-invalid = true },
    { path = "tokio::time::sleep", reason = "platform().sleep()", allow-invalid = true },
    { path = "tokio::time::sleep_until", reason = "platform().sleep()", allow-invalid = true },
    { path = "tokio::time::timeout", reason = "platform().sleep() with a select", allow-invalid = true },
    { path = "tokio::time::timeout_at", reason = "platform().sleep() with a select", allow-invalid = true },
    { path = "tokio::time::interval", reason = "platform().sleep() in a loop", allow-invalid = true },
    { path = "tokio::time::interval_at", reason = "platform().sleep() in a loop", allow-invalid = true },
    { path = "tokio::time::Instant::now", reason = "platform().monotonic()", allow-invalid = true },
    # the clipboard and the file dialogs
    { path = "arboard::Clipboard::new", reason = "platform().copy() / paste()", allow-invalid = true },
    { path = "rfd::AsyncFileDialog::new", reason = "platform().pick_file() and friends", allow-invalid = true },
    { path = "rfd::FileDialog::new", reason = "platform().pick_file() and friends", allow-invalid = true },
]
