# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "molt-ui"
description = "Slint GUI: the live-mirror operator. Drives the same Command set as MCP."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Dev-only GUI iteration (scripts/dev-ui.sh). Passes through to molt-ui-window.
live-preview = ["molt-ui-window/live-preview"]

[dependencies]
molt-ui-window.workspace = true
molt-core.workspace = true
# the remote engine handle (the web door's client); the native window holds the engine's own
molt-ui-kit.workspace = true
# runtime-neutral primitives for the shared code: the reply oneshots and
# the draft saver's async lock (`std` carries `lock::Mutex`)
futures-channel.workspace = true
futures-util = { workspace = true, features = ["std"] }
slint.workspace = true
serde.workspace = true # the local wiki draft round-trips (WP-D)
serde_json.workspace = true
tracing.workspace = true
base64.workspace = true
image.workspace = true
chrono = { workspace = true, features = ["clock"] } # local time display
paste.workspace = true
# wiki pane: markdown pseudo-render + block diffs for the pending-change view
pulldown-cmark.workspace = true
similar.workspace = true
# the purse's deposit QR
qrcode.workspace = true
# the recovery-phrase wordlist behind the typed-word chips: the same crate
# storage parses a phrase with, taken directly (pure Rust, no I/O)
bip39.workspace = true

# What a browser build cannot have (docs/web_gui.md §4, §6.7). Only
# src/native.rs names them, engine.rs's native arm aside; a test pins that
# (tests/gui/spawner.rs) and W5 gates both.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# the engine in this process (engine.rs)
molt-engine.workspace = true
# canonical `~` expansion (expand_tilde) — the browse dialog must resolve
# the workspace-dir draft exactly like the engine does
molt-storage.workspace = true
# random_token: the minted seat key and the alert file's nonce (§6.3)
molt-config.workspace = true
# the window's runtime (§6.2)
tokio.workspace = true
# clipboard for the seed copy button (X11: contents live as long as the app)
arboard.workspace = true
# the native file and folder dialogs behind the platform seam (§6.3); a
# browser build brings its own in molt-web
rfd.workspace = true

[dev-dependencies]
tempfile.workspace = true
# The HEADLESS Slint backend. The GUI's own logic - the live-mirror pushes
# and what they put into the window's models - was untestable without a
# display, so three chat bugs in a row were diagnosed by reasoning instead
# of by evidence. This runs the real AppWindow with no window.
i-slint-backend-testing = "1.17"
# TEST-ONLY: proves the bundled code font gives every glyph one advance.
ttf-parser = "0.25"
# TEST-ONLY, and deliberately not a runtime dep: the link-dispatch tests
# render their fixtures through the real invite/recovery handover types
# instead of hand-writing link strings a format change would silently
# invalidate. Layering-legal (net sits below engine, which molt-ui already
# depends on); the shipped GUI still talks to the engine only.
molt-net.workspace = true
# TEST-ONLY: the window against a REMOTE engine - a real web door on
# loopback and the shipped client over a tokio WebSocket.
molt-remote.workspace = true
tokio-tungstenite.workspace = true
# TEST-ONLY: two real engines found a republic over an in-process relay,
# one of them driven through the web door (as molt-engine's own tests do).
nostr-relay-builder.workspace = true
# TEST-ONLY: the skill modal shows the text MCP serves (the shipped GUI
# takes it from molt-core).
molt-mcp.workspace = true
# TEST-ONLY: the vault fixtures derive each seat's real vault key.
molt-vault.workspace = true
