# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "molt-ui"
description = "Slint GUI: the live-mirror operator. Drives the same Command set as MCP."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Dev-only GUI iteration (scripts/dev-ui.sh). Passes through to molt-ui-window.
live-preview = ["molt-ui-window/live-preview"]

[dependencies]
molt-ui-window.workspace = true
molt-core.workspace = true
molt-config.workspace = true
# canonical `~` expansion (expand_tilde) — the browse dialog must resolve
# the workspace-dir draft exactly like the engine does
molt-storage.workspace = true
molt-engine.workspace = true
tokio.workspace = true
slint.workspace = true
serde.workspace = true # the local wiki draft round-trips (WP-D)
serde_json.workspace = true
tracing.workspace = true
# clipboard for the seed copy button (X11: contents live as long as the app)
arboard.workspace = true
rfd.workspace = true
base64.workspace = true
image.workspace = true
chrono.workspace = true
paste.workspace = true
# wiki pane: markdown pseudo-render + block diffs for the pending-change view
pulldown-cmark.workspace = true
similar.workspace = true

[dev-dependencies]
tempfile.workspace = true
# The HEADLESS Slint backend. The GUI's own logic - the live-mirror pushes
# and what they put into the window's models - was untestable without a
# display, so three chat bugs in a row were diagnosed by reasoning instead
# of by evidence. This runs the real AppWindow with no window.
i-slint-backend-testing = "1.17"
# TEST-ONLY, and deliberately not a runtime dep: the link-dispatch tests
# render their fixtures through the real invite/recovery handover types
# instead of hand-writing link strings a format change would silently
# invalidate. Layering-legal (net sits below engine, which molt-ui already
# depends on); the shipped GUI still talks to the engine only.
molt-net.workspace = true
