# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "molt-ui-window"
description = "The Slint-generated window of the GUI (its own crate so the ~400k-line generated module only recompiles when a .slint file changes)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Dev-only: with SLINT_LIVE_PREVIEW=1 at build time, slint-build emits small
# interpreter-backed stubs (same API) instead of the ~400k-line module, and the
# running app hot-reloads .slint saves. Use via scripts/dev-ui.sh — never a
# default; release builds stay fully compiled.
live-preview = ["slint/live-preview"]

[dependencies]
slint.workspace = true

[build-dependencies]
slint-build.workspace = true
