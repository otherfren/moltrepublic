[package]
name = "molt-storage"
description = "Encrypted append-only workspace storage: framed event log with segment rotation, snapshots, key hierarchy off the recovery seed, per-workspace lock, manifest scan."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
molt-core.workspace = true
# only for `sync` oneshots: the writer thread answers async callers
