# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "molt-engine"
description = "The wallet-core actor: a single owning task that executes Commands and emits Events."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Dev only, never a default, never in a release build: with it compiled in,
# MOLT_VAULT_LAB_COMPLAIN=1 at spawn makes this node's holder receipts
# complain (vault build plan S3c step 7).
vault-lab = []

[dependencies]
molt-core.workspace = true
molt-config.workspace = true
molt-storage.workspace = true
zeroize.workspace = true
rustix.workspace = true
molt-net.workspace = true
molt-vault.workspace = true
molt-treasury.workspace = true
# the deposit's OS-seeded nonce stream, the rand_core molt-vault takes
rand_chacha.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
getrandom.workspace = true
hex.workspace = true
chrono.workspace = true # kanban: today in UTC from the engine clock
sha2.workspace = true
base64.workspace = true
# set_image decodability sniff (guess_format + header dimensions, never a
# full decode) — same pure-Rust decoder set as the molt-ui preview
image.workspace = true
# the wiki index (knowledge_base_scale.md §4.4-4.5): the header's YAML subset
# and the body's links. Both pure Rust, both parse-only.
yaml-rust2.workspace = true
pulldown-cmark.workspace = true
tantivy.workspace = true

[dev-dependencies]
# the in-process monerod double for the purse tests
molt-net = { workspace = true, features = ["stub-daemon"] }
# a backup whose purse keys file does not authenticate
molt-storage = { workspace = true, features = ["test-forge"] }
tempfile.workspace = true
# make WARN/DEBUG from the engine + net visible in the ignored live-server
# tests (a silent tracing::warn is how the 2026-07-19 mesh stall hid)
tracing-subscriber.workspace = true
# test-util only: paused-clock tests (the join accept-deadline elapses
# instantly on an idle runtime instead of waiting out the real 90 s)
tokio = { workspace = true, features = ["test-util"] }
# dev-only cycle (cargo allows it): the cross-frontend integration test
# proves the MCP tool layer builds the SAME filtered reads the engine path
# serves — co-equality end to end
# in-process Nostr relay for the N4 ritual keystones (the engine-level twin
# of two_instances over a MockRelay) — dev-only, like molt-net's
nostr-relay-builder = { workspace = true }
