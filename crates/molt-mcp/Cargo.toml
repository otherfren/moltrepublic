# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "molt-mcp"
description = "MCP interface: maps MCP tool calls onto the one Command set. The headless operator."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
molt-core.workspace = true
molt-engine.workspace = true
tokio.workspace = true
serde_json.workspace = true
tracing.workspace = true
# constant-time token comparison (review F6)
subtle = "2"
# Streamable HTTP (docs_archive/security/streamable_http.md): the official SDK's tower
# service, served by hyper on the sniffed MCP port
rmcp = { version = "3.3", default-features = false, features = ["server", "transport-streamable-http-server"] }
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
tower-service = "0.3"
