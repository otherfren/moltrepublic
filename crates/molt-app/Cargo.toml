# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "molt-app"
description = "The MoltRepublic node binary: UI mode (GUI + MCP) or headless (MCP-only)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "moltd"
path = "src/main.rs"

[features]
# Compile the in-process arti Tor dialer into the binary (P3). Off by default —
# the reproducible core build stays lean; a build with it flipped lets the GUI
# offer the "embedded" tor-mode. Passes straight through to molt-net.
embedded-tor = ["molt-net/embedded-tor"]
# Dev-only GUI iteration: Slint live-preview stubs + runtime .slint hot reload.
# Use via scripts/dev-ui.sh, never as a default. Passes through to molt-ui.
live-preview = ["molt-ui/live-preview"]

[dependencies]
molt-core.workspace = true
molt-storage.workspace = true
molt-config.workspace = true
molt-net.workspace = true
molt-engine.workspace = true
molt-mcp.workspace = true
molt-ui.workspace = true
tokio.workspace = true
clap.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
