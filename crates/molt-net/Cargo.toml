# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "molt-net"
description = "The transport layer: MLS-protected payloads over queue transports (loopback today, Nostr relays in build). Transport trait, uniform-block framing (chunker, per-queue wrapping), LoopbackTransport with chaos harness, the log-backed outbox supervisor, and the fail-closed Tor dialer."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Embedded in-process Tor via arti (transport concept §4, T4 §P3). Default
# OFF so the reproducible core build stays lean and the default Cargo.lock is
# unperturbed. The cfg-gated `Dialer::Arti` scaffolding (dial.rs) + the
# arti bootstrap (tor_embedded.rs) compile ONLY under this feature.
#
# **B2 RESOLVED (2026-07-11): the C dependency is ACCEPTED, opt-in only.**
# The user decided (2026-07-11) to accept a C toolchain for the OPT-IN
# `embedded-tor` feature — turning it OFF removes ITS C deps from the graph
# (optional-off deps never compile). NOTE the DEFAULT build is no longer
# fully pure-Rust since N1: the promoted `nostr` dependency (below) pulls C
# `secp256k1-sys` — the sanctioned ADR-0002 exception. `ring` must still
# stay out of the default graph. Honest record of
# what turning the feature ON pulls, unchanged from the first attempt's audit:
#   arti-client 0.42 → tor-dirmgr 0.42 → rusqlite 0.39 → libsqlite3-sys 0.37
#     (+ a `cc` build-dep)
# `rusqlite` is a NON-optional dependency of tor-dirmgr (arti's persistent
# directory-cache store) — no arti/tor-dirmgr feature removes it, and
# `static`/`static-sqlite` (`rusqlite/bundled`) would only make it worse
# (compiles SQLite from C via cc, rather than linking the system lib). We take
# the minimal feature set that builds: `arti-client { default-features = false,
# features = ["tokio","rustls"] }` drops native-tls (OpenSSL) and the
# compression codecs (zstd-sys/lzma-sys), leaving libsqlite3-sys as the only
# C dep. Verify with `cargo tree -p molt-net --features embedded-tor -e no-dev`.
# The DEFAULT graph is ring-free: `cargo tree -p molt-net -e no-dev -i ring`
# must print "nothing to print" (the dev-only Nostr relay-pool crates pin a
# ring-provider tokio-rustls, which the runtime must never silently re-adopt
# before the explicit N2 WS/TLS decision).
embedded-tor = ["dep:arti-client", "dep:tor-rtcompat"]

[dependencies]
molt-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
chacha20poly1305.workspace = true
getrandom.workspace = true
sha2.workspace = true
hmac.workspace = true
tokio-socks.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true # Sink/Stream adapters for the WS split (relay_ws)
httparse.workspace = true # NIP-11 probe: parse the HTTP response head (relay_runtime)
url.workspace = true # relay URL → host/port/path for the dialer (same parser as molt-core's policy)
zeroize.workspace = true
hex.workspace = true
# Pure-Rust TLS (the T4 dialer + S3-over-https; N2's WebSockets reuse it)
rustls.workspace = true
tokio-rustls.workspace = true
rustls-rustcrypto.workspace = true
# S3 backup probe (mock_todo §5): https endpoints verify against the public
# WebPKI — webpki-roots is Mozilla's root store compiled in as pure-Rust data
# (no C, no system cert store dependency).
webpki-roots.workspace = true
ed25519-dalek.workspace = true
# MLS (T2): group encryption of the live traffic. See workspace manifest.
openmls.workspace = true
openmls_traits.workspace = true
openmls_rust_crypto.workspace = true
openmls_basic_credential.workspace = true
tls_codec.workspace = true
bincode.workspace = true
# Nostr identity + envelope crypto (N1, `nostr_transport_marmot.md` §3): the
# ticket-salted secp256k1 transport anchor (src/nostr.rs) and, from N3 on, the
# NIP-44/NIP-59 envelopes. Pulls the C `secp256k1`/`secp256k1-sys` backend into
# the DEFAULT build graph — the sanctioned transport-edge C exception
# (ADR-0002; verify with `cargo tree -p molt-net -e no-dev -i secp256k1-sys`).
nostr.workspace = true
# Embedded-Tor (opt-in `embedded-tor` feature only) — see the [features] note.
# Both optional: the DEFAULT build never compiles them, so they add nothing to
# the default graph (whose one C exception since N1 is nostr's secp256k1 —
# ADR-0002). Minimal feature set: `tokio` + `rustls` (drops
# native-tls/OpenSSL and the zstd/xz compression C deps); libsqlite3-sys (via
# tor-dirmgr) is the accepted C dep.
arti-client = { version = "0.42", default-features = false, features = ["tokio", "rustls"], optional = true }
tor-rtcompat = { version = "0.42", optional = true }

[dev-dependencies]
# `test-util` (paused-clock auto-advance) drives the bounded-dial-timeout test
# without a 30 s real wait. Dev-only: the default build graph is unchanged.
tokio = { workspace = true, features = ["test-util"] }
# `tempfile` backs the embedded-tor config-to-state-dir unit test (feature-gated,
# dev-only — the default non-dev graph is unchanged).
tempfile = { workspace = true }
# Nostr relay pool + in-process test relay (tests/nostr_vectors.rs,
# tests/nostr_relay_poc.rs). Dev-only on purpose — `nostr` itself is a real
# dependency since N1, but the pool's WS stack (async-wsocket) pins
# tokio-rustls/ring, which the RUNTIME only adopts — or not — by the explicit
# N2 decision, never as a side effect.
nostr-relay-pool = { workspace = true }
nostr-relay-builder = { workspace = true }
# byte-pin of the vectors' get_message_keys section: recompute the expected
# ciphertext from the reference chacha/hmac keys (same 0.9 line nostr uses)
chacha20 = { workspace = true }
# the nip44 vector file carries base64 payloads (tests/nostr_vectors.rs).
# Dev-only: nothing under src/ uses base64 — the runtime graph stays without it.
base64 = { workspace = true }
