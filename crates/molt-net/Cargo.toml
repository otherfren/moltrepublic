# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "molt-net"
description = "The transport layer: MLS-protected payloads over SMP-style queues. T1 scope: Transport trait, uniform-block framing (chunker, per-queue wrapping), LoopbackTransport with chaos harness, and the log-backed outbox supervisor."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Embedded in-process Tor via arti (transport concept §4, T4 §P3). Default
# OFF so the reproducible core build stays lean and the default Cargo.lock is
# unperturbed. The cfg-gated `Dialer::Arti` scaffolding (smp/tls.rs) compiles
# under this feature at Stage A; **Stage B (B2)** wires the real dependency
# link here — `embedded-tor = ["dep:arti-client", "dep:tor-rtcompat"]` with
# both deps `optional = true` — once it has pinned compatible, pure-Rust
# (no C toolchain) arti versions. Kept dep-less until then so this pass adds
# nothing to the default dependency graph.
embedded-tor = []

[dependencies]
molt-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
chacha20poly1305.workspace = true
getrandom.workspace = true
sha2.workspace = true
hmac.workspace = true
zeroize.workspace = true
hex.workspace = true
# SMP transport (T3): pure-Rust TLS + cert pinning + queue crypto
rustls.workspace = true
tokio-rustls.workspace = true
rustls-rustcrypto.workspace = true
rustls-pki-types.workspace = true
x509-parser.workspace = true
base64.workspace = true
ed25519-dalek.workspace = true
x25519-dalek.workspace = true
crypto_box.workspace = true
ed448-goldilocks = "0.9"
sha3 = "0.10"
# MLS (T2): group encryption of the live traffic. See workspace manifest.
openmls.workspace = true
openmls_traits.workspace = true
openmls_rust_crypto.workspace = true
openmls_basic_credential.workspace = true
tls_codec.workspace = true
bincode.workspace = true

[dev-dependencies]
# `test-util` (paused-clock auto-advance) drives the bounded-dial-timeout test
# without a 30 s real wait. Dev-only: the default build graph is unchanged.
tokio = { workspace = true, features = ["test-util"] }
